<!DOCTYPE html>
<html>
<head>
  <title>Google Maps API - Traffic Example</title>
  <script src="https://maps.googleapis.com/maps/api/js?key=
YOUR_API_KEY&callback=initMap" async defer></script>
  <script>
    
    function initMap() {    #A
      
      var mapOptions = {    #B
        center: { lat: 30.267153, lng: -97.743057 }, 
        zoom: 12
      };
      
      var map = new google.maps.Map(document.getElementById("map"), mapOptions);    #C
      
      var trafficLayer = new google.maps.TrafficLayer();    #D
      trafficLayer.setMap(map);
    }
  </script>
  <style>
    #map {
      height: 800px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
</body>
</html>
#A Initialize and load the map
#B Specify the center and zoom level of the map
#C Create a new map instance
#D Enable traffic layer
